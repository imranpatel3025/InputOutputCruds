<ul class="list-group">
    <li class="list-group-item d-flex justify-content-between" *ngFor="let todo of todoData">
        <div>
            <input [checked]="todo.isCompleted" type="checkbox" class="mr-2">
            <strong>{{todo.todoName}}</strong>
        </div>

        <div>
            <button (click)="onEditTodo(todo)" mat-mini-fab color="primary" class="mr-2">
                <mat-icon>edit</mat-icon>
            </button>
            <button (click)="onDelete(todo.todoId)" mat-mini-fab color="warn">
                <mat-icon>delete</mat-icon>
            </button>
        </div>
    </li>
</ul>
