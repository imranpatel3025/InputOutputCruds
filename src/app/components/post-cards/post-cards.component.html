<div class="container">
    <div class="row">
        <ng-container *ngIf="postData.length > 0 ; else noPosts">
            <div class="col-md-4 mb-3" *ngFor="let post of postData">
            <div class="card h-100 cardBody">
                <div class="card-header text-nowrap text-truncate">
                    {{post.title}}
                </div>
                <div class="card-body">
                    {{post.body}}
                </div>
                <div class="card-footer d-flex justify-content-between align-items-center">
                    <button
                        (click)="onEdit(post)"
                     mat-mini-fab color="primary">
                        <mat-icon>edit</mat-icon>
                    </button>
                     <button
                        (click)="onRemove(post.id)"
                      mat-mini-fab color="warn">
                        <mat-icon>delete</mat-icon>
                    </button>
                </div>
            </div>
        </div>
        </ng-container>
        <ng-template #noPosts>
            <p class="m-0 text-center bg-warning ">No Post Added Yet....</p>
        </ng-template>
    </div>
</div>
