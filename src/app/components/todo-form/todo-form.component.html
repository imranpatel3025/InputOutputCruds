<div class="card">
    <div class="card-body">
        <form #todoForm="ngForm" (ngSubmit)="onTodoAdd()">
            <div class="form-group">
                <label for="todoName">Enter Name</label>
                <input required name="todoName" ngModel type="text" class="form-control">
            </div>
            <div class="form-group">
                <label for="isCompleted">Is Completed</label>
                <select required name="isCompleted" ngModel type="text" class="form-control">
                    <option [ngValue]="true">Yes</option>
                    <option [ngValue]="false">No</option>
                </select>
            </div>
            <button *ngIf="!isInEditMode" mat-raised-button color="primary" class="btn-block">Add Todo</button>
            
            <button type="button" *ngIf="isInEditMode" mat-raised-button color="primary" class="btn-block">Update Todo</button>
        </form>
    </div>
</div>
