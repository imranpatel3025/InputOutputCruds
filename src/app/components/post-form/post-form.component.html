
<div class="col-md-6 offset-3 mb-3">
    <form #postForm="ngForm" (ngSubmit)="onPostAdd()">
        <div class="form-group">
            <label for="title">Enter Title</label>
            <input name="title" ngModel type="text" class="form-control">
        </div>
         <div class="form-group">
            <label for="content">Enter Content</label>
            <input title="body" ngModel type="text" class="form-control">
        </div>
        <button mat-raised-button color="primary" class="btn-block">Add Post</button>
    </form>
</div>
