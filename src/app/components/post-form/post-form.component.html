<div class="col-md-6 offset-3 mb-3">
    <div class="card bg-light">

        <div class="card-body">
            <h2 class="m-0 font-weight-bold text-center">{{isInEditMode ? 'Update Post' : 'Add Post'}} </h2> <hr>
            <form #postForm="ngForm" (ngSubmit)="onPostAdd()">
        <div class="form-group">
            <label for="title">Enter Title</label>
            <input name="title" ngModel type="text" class="form-control">
        </div>
        <div class="form-group">
            <label for="content">Enter Content</label>
            <textarea name="body" ngModel type="text" class="form-control">
                </textarea>
        </div>
        <button *ngIf="!isInEditMode" mat-raised-button color="primary" class="btn-block">Add Post</button>
        <button 
            (click)="onUpdate()"
        type="button" *ngIf="isInEditMode" mat-raised-button color="primary" class="btn-block">Update Post</button>
    </form>
        </div>
    </div>
</div>
